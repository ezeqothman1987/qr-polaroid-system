
<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>QR Polaroid - Connection Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }

    button {
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    pre {
      padding: 15px;
      background: #f1f1f1;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

  <h1>QR Polaroid System</h1>
  <h2>Backend Connection Test</h2>

  <p>
    Tekan butang untuk menguji sambungan
    GitHub Pages ke Google Apps Script.
  </p>

  <button id="testButton">
    Test Connection
  </button>
  
  <button id="postButton">
  Test POST Connection
</button>

<!-- ==========================================
     JPEG UPLOAD TEST
========================================== -->

<hr>

<h3>JPEG Upload Test</h3>

<p>
  Pilih satu gambar JPEG bersaiz
  maksimum 1 MB.
</p>

<input
  type="file"
  id="jpegFile"
  accept="image/jpeg"
>

<p>
  <button id="uploadButton">
    Upload Test JPEG
  </button>
</p>

  <h3>Connection Result:</h3>
  <pre id="result">Belum diuji.</pre>

  <script>

    // ============================================
    // TETAPAN SAMBUNGAN
    // ============================================

    // GANTIKAN URL DI BAWAH DENGAN
    // WEB APP URL /exec ANDA YANG SEBENAR.

    const API_URL =
      "https://script.google.com/macros/s/AKfycbypWTF9wRt5mCh2D8E4RPFlBXJGnkRHL1df-JAtL39mdTgPdN5aGREtlZhBsxwQSITo/exec";


    // ============================================
    // FUNGSI UJIAN SAMBUNGAN
    // ============================================

    async function testConnection() {

      const resultBox =
        document.getElementById("result");

      resultBox.textContent =
        "Sedang menguji sambungan...";

      try {

        // Hantar GET request ke Apps Script.
        // Browser akan menguatkuasakan CORS.

        const response = await fetch(API_URL, {
          method: "GET",
          mode: "cors",
          redirect: "follow",
          cache: "no-store"
        });

        // Pastikan HTTP response berjaya.
        if (!response.ok) {
          throw new Error(
            "HTTP Error: " + response.status
          );
        }

        // Cuba baca respons sebagai JSON.
        const data = await response.json();

        // Pastikan respons yang diterima betul.
        if (
          data.status !== "SUCCESS" ||
          data.system !== "QR Polaroid System"
        ) {
          throw new Error(
            "Unexpected backend response"
          );
        }

        // Paparkan hasil berjaya.
        resultBox.textContent =
          "CONNECTION SUCCESS!\n\n" +
          JSON.stringify(data, null, 2);

      } catch (error) {

        // Paparkan ralat untuk diagnosis.
        resultBox.textContent =
          "CONNECTION FAILED\n\n" +
          error.name + ": " + error.message;

        console.error(
          "QR Polaroid Connection Error:",
          error
        );
      }
    }


    // ============================================
    // BUTANG UJIAN
    // ============================================

    document
      .getElementById("testButton")
      .addEventListener(
        "click",
        testConnection
      );

// ============================================
// UJIAN POST REQUEST
// ============================================

async function testPostConnection() {

  const resultBox =
    document.getElementById("result");

  resultBox.textContent =
    "Sedang menguji POST request...";

  try {

    // ---- DATA UJIAN ----
    const payload = {
      action: "test_post",
      message: "Hello from GitHub Pages"
    };

    // ---- HANTAR POST KE APPS SCRIPT ----
    const response = await fetch(API_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload)
    });

    // ---- SEMAK HTTP RESPONSE ----
    if (!response.ok) {
      throw new Error(
        "HTTP Error: " + response.status
      );
    }

    // ---- BACA JSON ----
    const data = await response.json();

    if (
      data.status !== "SUCCESS" ||
      data.message !== "POST request received"
    ) {
      throw new Error(
        "Unexpected POST response: " +
        JSON.stringify(data)
      );
    }

    // ---- PAPARKAN KEJAYAAN ----
    resultBox.textContent =
      "POST CONNECTION SUCCESS!\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {

    // ---- PAPARKAN RALAT ----
    resultBox.textContent =
      "POST CONNECTION FAILED\n\n" +
      error.name + ": " + error.message;

    console.error(
      "POST Connection Error:",
      error
    );
  }
}

// ============================================
// AKTIFKAN BUTANG POST
// ============================================

document
  .getElementById("postButton")
  .addEventListener(
    "click",
    testPostConnection
  );

// ============================================
// LANGKAH 2.5 - JPEG UPLOAD TEST
// ============================================

async function testJpegUpload() {

  const resultBox =
    document.getElementById("result");

  const fileInput =
    document.getElementById("jpegFile");

  const uploadButton =
    document.getElementById("uploadButton");

  const file = fileInput.files[0];

  // ---- SEMAK FAIL DIPILIH ----
  if (!file) {
    resultBox.textContent =
      "Sila pilih gambar JPEG dahulu.";
    return;
  }

  // ---- SEMAK JENIS FAIL ----
  if (file.type !== "image/jpeg") {
    resultBox.textContent =
      "Hanya fail JPEG dibenarkan.";
    return;
  }

  // ---- SEMAK SAIZ FAIL ----
  if (file.size > 1048576) {
    resultBox.textContent =
      "Gambar melebihi 1 MB.";
    return;
  }

  uploadButton.disabled = true;

  resultBox.textContent =
    "Sedang memuat naik gambar...";

  try {

    // ---- TUKAR FAIL KEPADA BASE64 ----
    const base64 = await new Promise(
      (resolve, reject) => {

        const reader = new FileReader();

        reader.onload = () => {
          const result = String(reader.result);
          resolve(result.split(",")[1]);
        };

        reader.onerror = () => {
          reject(new Error("File reading failed"));
        };

        reader.readAsDataURL(file);
      }
    );

    // ---- SEDIAKAN DATA UPLOAD ----
    const payload = {
      action: "test_upload",
      image: base64
    };

    // ---- HANTAR KE APPS SCRIPT ----
    const response = await fetch(API_URL, {
      method: "POST",
      mode: "cors",
      redirect: "follow",
      headers: {
        "Content-Type": "text/plain"
      },
      body: JSON.stringify(payload)
    });

    if (!response.ok) {
      throw new Error(
        "HTTP Error: " + response.status
      );
    }

    const data = await response.json();

    if (data.status !== "SUCCESS") {
      throw new Error(
        data.message || "Upload failed"
      );
    }

    // ---- PAPARKAN KEPUTUSAN ----
    resultBox.textContent =
      "JPEG UPLOAD SUCCESS!\n\n" +
      JSON.stringify(data, null, 2);

  } catch (error) {

    resultBox.textContent =
      "JPEG UPLOAD FAILED\n\n" +
      error.name + ": " + error.message;

    console.error("Upload Error:", error);

  } finally {

    uploadButton.disabled = false;
  }
}


// ---- AKTIFKAN BUTANG UPLOAD ----
document
  .getElementById("uploadButton")
  .addEventListener(
    "click",
    testJpegUpload
  );

  </script>

</body>
</html>
