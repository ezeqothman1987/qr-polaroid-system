<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>QR Polaroid — Kamera</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:18px 12px;background:#101521;color:#edf1f7}.panel{max-width:510px;margin:16px auto;padding:22px;background:#1c2636;border:1px solid #344155;border-radius:20px}h1{margin:0 0 7px;font-size:1.6rem}p{line-height:1.5;color:#c2cddd}.status{padding:12px;border-radius:10px;background:#29364a;margin:15px 0;overflow-wrap:anywhere}.ok{background:#173b30;color:#b5f2d2}.bad{background:#442a30;color:#ffced6}.hidden{display:none!important}.polaroid{background:#f5f2e9;padding:12px 12px 44px;border-radius:4px;box-shadow:0 14px 28px #0005;max-width:380px;margin:16px auto}.viewport{position:relative;aspect-ratio:1;background:#101010;overflow:hidden}.viewport video,.viewport img{width:100%;height:100%;object-fit:cover;display:block}.viewport video.mirror{transform:scaleX(-1)}.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}button{background:#a5d8ff;color:#12202f;border:0;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer}button.secondary{background:#3a4d66;color:white}button:disabled{opacity:.45;cursor:not-allowed}label{display:block;margin:16px 0 7px;font-weight:600}input[type=file]{max-width:100%;padding:10px;border:1px dashed #72839a;border-radius:8px}.small{font-size:.86rem;color:#c4cfdf}#uploadNotice{border-left:3px solid #f2c46b;padding-left:11px}</style></head>
<body><main class="panel"><h1>📸 QR Polaroid</h1><p>Imbas QR acara, ambil gambar dan semak pratonton sebelum menghantar.</p><div id="status" class="status" role="status" aria-live="polite">Menyemak kod QR…</div>
<section id="captureArea" class="hidden"><div class="polaroid"><div class="viewport"><video id="camera" autoplay playsinline muted class="hidden"></video><img id="preview" class="hidden" alt="Pratonton gambar JPEG"><div id="cameraHint" class="small" style="padding:25px;text-align:center">Tekan “Buka kamera” untuk mula.</div></div></div>
<div class="controls"><button id="start">Buka kamera</button><button id="flip" class="secondary" disabled>Tukar kamera</button><button id="snap" disabled>Ambil gambar</button><button id="retake" class="secondary" disabled>Ambil semula</button></div>
<label for="jpeg">Atau pilih gambar JPEG</label><input id="jpeg" type="file" accept="image/jpeg,.jpg,.jpeg"><p id="fileInfo" class="small" aria-live="polite"></p><p id="uploadNotice" class="small">Penghantaran belum diaktifkan. Gambar hanya dipratonton pada peranti ini.</p><button id="upload" disabled>Hantar gambar (belum tersedia)</button></section>
<canvas id="canvas" class="hidden"></canvas></main>
<script>
// ---- KONFIGURASI: URL asal dikekalkan. Jangan letak password atau secret di sini. ----
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbypWTF9wRt5mCh2D8E4RPFlBXJGnkRHL1df-JAtL39mdTgPdN5aGREtlZhBsxwQSITo/exec';
const MAX_JPEG_BYTES=8*1024*1024;
// Keselamatan: kekal false sehingga endpoint upload_jpeg LIVE telah diuji dan diluluskan.
const ENABLE_PUBLIC_JPEG_UPLOAD=false;
const $=id=>document.getElementById(id);
let qrToken='',stream=null,facing='environment',selectedBlob=null,objectUrl=null;
const status=(msg,cls='')=>{$('status').textContent=msg;$('status').className='status '+cls;};
function releasePreview(){if(objectUrl){URL.revokeObjectURL(objectUrl);objectUrl=null;}selectedBlob=null;$('preview').removeAttribute('src');$('preview').classList.add('hidden');$('retake').disabled=true;}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}$('camera').srcObject=null;$('camera').classList.add('hidden');$('snap').disabled=true;$('flip').disabled=true;}
function displayBlob(blob){releasePreview();selectedBlob=blob;objectUrl=URL.createObjectURL(blob);$('preview').src=objectUrl;$('preview').classList.remove('hidden');$('cameraHint').classList.add('hidden');$('retake').disabled=false;$('fileInfo').textContent='JPEG tersedia: '+(blob.size/1048576).toFixed(2)+' MiB. Belum dihantar.';}
async function checkQR(){const u=new URL(location.href);qrToken=u.searchParams.get('qr_token')||'';u.searchParams.delete('qr_token');history.replaceState(null,'',u.pathname+u.search+u.hash);if(!/^[a-f0-9]{64}$/i.test(qrToken)){status('Kod QR tidak sah. Sila imbas semula.','bad');return;}try{const r=await fetch(WEB_APP_URL,{method:'POST',headers:{'Content-Type':'text/plain'},credentials:'omit',body:JSON.stringify({action:'check_qr',qr_token:qrToken})});if(!r.ok)throw Error('HTTP');const x=await r.json();if(x?.code==='QR_AVAILABLE'&&x.data?.eligible===true&&Number.isInteger(x.data.remaining_uploads)&&x.data.remaining_uploads>0){status('QR aktif. Baki kuota: '+x.data.remaining_uploads+' gambar.','ok');$('captureArea').classList.remove('hidden');return;}const m={INVALID_QR:'Kod QR tidak sah.',QR_INACTIVE:'Kod QR tidak aktif.',EVENT_NOT_STARTED:'Acara belum bermula.',EVENT_ENDED:'Acara telah tamat.',EVENT_INACTIVE:'Acara tidak aktif.',QUOTA_FULL:'Kuota gambar telah penuh.'};status(m[x?.code]||'Semakan QR tidak berjaya.','bad');}catch(e){status('Sambungan gagal. Sila cuba lagi.','bad');}}
async function startCamera(){stopCamera();releasePreview();$('cameraHint').classList.add('hidden');if(!navigator.mediaDevices?.getUserMedia){$('fileInfo').textContent='Kamera tidak disokong. Sila pilih gambar JPEG.';return;}try{stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:1280}}});$('camera').srcObject=stream;$('camera').classList.remove('hidden');$('camera').classList.toggle('mirror',facing==='user');await $('camera').play();$('snap').disabled=false;$('flip').disabled=false;$('fileInfo').textContent='Kamera sedia. Ambil gambar apabila bersedia.';}catch(e){$('fileInfo').textContent='Kamera tidak dapat dibuka. Benarkan akses kamera atau pilih fail JPEG.';}}
$('start').onclick=startCamera;
$('flip').onclick=()=>{facing=facing==='environment'?'user':'environment';startCamera();};
$('snap').onclick=()=>{const v=$('camera');if(!v.videoWidth||!v.videoHeight)return;const side=Math.min(v.videoWidth,v.videoHeight);const c=$('canvas');c.width=1000;c.height=1000;const ctx=c.getContext('2d');const sx=(v.videoWidth-side)/2,sy=(v.videoHeight-side)/2;if(facing==='user'){ctx.translate(1000,0);ctx.scale(-1,1);}ctx.drawImage(v,sx,sy,side,side,0,0,1000,1000);c.toBlob(b=>{if(!b){$('fileInfo').textContent='Gagal memproses JPEG.';return;}if(b.size>MAX_JPEG_BYTES){$('fileInfo').textContent='JPEG melebihi 8 MiB.';return;}stopCamera();displayBlob(b);},'image/jpeg',0.85);};
$('retake').onclick=()=>{releasePreview();startCamera();};
$('jpeg').onchange=async()=>{const f=$('jpeg').files?.[0];if(!f)return;if(f.size<4||f.size>MAX_JPEG_BYTES||f.type!=='image/jpeg'){$('fileInfo').textContent='Sila pilih JPEG sah maksimum 8 MiB.';return;}const head=new Uint8Array(await f.slice(0,3).arrayBuffer());const tail=new Uint8Array(await f.slice(-2).arrayBuffer());if(head[0]!==255||head[1]!==216||head[2]!==255||tail[0]!==255||tail[1]!==217){$('fileInfo').textContent='Kandungan JPEG tidak sah.';return;}stopCamera();displayBlob(f);};
$('upload').onclick=()=>{if(!ENABLE_PUBLIC_JPEG_UPLOAD)return;};
window.addEventListener('pagehide',()=>{stopCamera();releasePreview();});
checkQR();
</script></body></html>
