
<!DOCTYPE html>
<html lang="ms">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>QR Polaroid - HTTP/CORS Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      padding: 24px;
      color: #243042;
    }

    .panel {
      max-width: 560px;
      margin: 40px auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 5px 20px #00000012;
    }

    h2 {
      margin-top: 0;
    }

    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
    }

    input {
      border: 1px solid #ccd3dc;
    }

    button {
      border: 0;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    pre {
      background: #eef2f6;
      padding: 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .note {
      font-size: 13px;
      color: #657184;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="panel">

    <h2>QR Polaroid HTTP/CORS Test</h2>

    <p class="note">
      Ujian sambungan sahaja.
      Tiada upload atau perubahan database.
    </p>

    <label for="url">
      Google Apps Script Web App URL
    </label>

    <input
      id="url"
      type="url"
      placeholder="https://script.google.com/macros/s/.../exec"
    >

    <button id="testButton">
      Test POST Connection
    </button>

    <h3>Keputusan</h3>

    <pre id="result">
Belum diuji.
    </pre>

  </div>

  <script>

    // =========================================
    // LANGKAH 5.03A
    // HTTP / CORS CONNECTION TEST
    // =========================================

    const button =
      document.getElementById("testButton");

    const resultBox =
      document.getElementById("result");

    button.addEventListener("click", async () => {

      const url =
        document.getElementById("url")
          .value.trim();

      // ---- VALIDASI URL ----

      let parsedUrl;

      try {
        parsedUrl = new URL(url);
      } catch {
        resultBox.textContent =
          "ERROR: URL tidak sah.";
        return;
      }

      if (
        parsedUrl.protocol !== "https:" ||
        parsedUrl.hostname !==
          "script.google.com" ||
        !/^\/macros\/s\/[^/]+\/exec$/.test(
          parsedUrl.pathname
        )
      ) {
        resultBox.textContent =
          "ERROR: Gunakan URL Web App /exec.";
        return;
      }

      // ---- SEDIAKAN PERMINTAAN ----

      const payload = {
        action: "test_post",
        message: "QR Polaroid CORS Test"
      };

      button.disabled = true;

      resultBox.textContent =
        "Menghantar permintaan...";

      try {

        // text/plain mengelakkan
        // preflight untuk permintaan ini,
        // tetapi tidak memintas CORS.

        const response = await fetch(url, {

          method: "POST",

          headers: {
            "Content-Type": "text/plain"
          },

          body: JSON.stringify(payload),

          redirect: "follow",

          credentials: "omit"

        });

        // Browser masih memerlukan
        // kebenaran CORS untuk membaca
        // respons dan JSON.

        const text = await response.text();

        let data;

        try {
          data = JSON.parse(text);
        } catch {
          throw new Error(
            "Respons bukan JSON yang sah"
          );
        }

        resultBox.textContent =
          JSON.stringify({
            http_status: response.status,
            response_readable: true,
            api_status: data.status,
            api_code: data.code,
            message: data.message
          }, null, 2);

      } catch (error) {

        // Ralat ini boleh berpunca daripada
        // CORS, rangkaian, redirect atau
        // masalah deployment.

        resultBox.textContent =
          JSON.stringify({
            result: "FETCH_FAILED",
            response_readable: false,
            error_type: error.name,
            explanation:
              "Semak Console dan Network " +
              "dalam Developer Tools. " +
              "Jangan anggap server tidak " +
              "menerima permintaan."
          }, null, 2);

      } finally {

        button.disabled = false;

      }

    });

  </script>

</body>
</html>
